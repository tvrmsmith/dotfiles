# Tokyo Night Dim - Orca terminal theme (Warp YAML format)
#
# Orca's builtin "Tokyo Night" already matches the tokyonight-night nvim
# colorscheme exactly. This variant changes one thing:
#   background  #1a1b26 -> #13141c  (the darker gutter tone tokyonight
#                                    already uses for sidebars)
# Foreground stays at the stock #c0caf5, so contrast rises from 10.6:1 to
# 11.4:1.
#
# normal.black is #0f0f14 rather than the builtin #15161e so black stays
# below the background instead of sitting a hair above it.
#
# Import: Orca > Settings > Appearance > Terminal Theme > Import from YAML.
name: Tokyo Night Dim
details: darker
background: "#13141c"
foreground: "#c0caf5"
accent: "#c0caf5"
terminal_colors:
  normal:
    black: "#0f0f14"
    red: "#f7768e"
    green: "#9ece6a"
    yellow: "#e0af68"
    blue: "#7aa2f7"
    magenta: "#bb9af7"
    cyan: "#7dcfff"
    white: "#a9b1d6"
  bright:
    black: "#414868"
    red: "#f7768e"
    green: "#9ece6a"
    yellow: "#e0af68"
    blue: "#7aa2f7"
    magenta: "#bb9af7"
    cyan: "#7dcfff"
    white: "#c0caf5"
