name: implement-in-waves
description: |
  Implement a parent bead's children in waves. Each run is one wave: list the
  parent's ready, unclaimed direct children, pause on a seam gate where an
  engineer approves the seams proposed for them, run implement-slice for each
  approved child in its own worktree, and once every slice has finished, start the next wave by
  itself when this one built anything. The chain ends on a wave that finds
  nothing new: it closes the parent once every child is closed, and otherwise
  pauses on an end gate that re-dispatches the open children or stops.
  `wave-status <run-id>` reads the whole chain back from Archon's run records.

  Use when: a parent bead has several ready children whose specs live in
  their beads. Start it from the target repository's checkout, with
  beads_dir naming the tracker.
  NOT for: one slice (run implement-slice), or a target that is not a git
  repository Archon can cut worktrees in.

# The wave only reads the code and tracker, settles its beads' notes, and
# starts runs, so it runs in the checkout it was launched from. Every slice gets its own worktree from the fan-out.
model: large

worktree:
  enabled: false

# The wave never writes to that checkout, so it takes no path lock. With the
# lock, `next` would race its own wave: the wave it starts finds this one
# still active on the path and cancels itself, unless this run completes
# before that one boots. A second dispatch of the same parent is then held
# off by bd's claim instead (see the README for the gap that leaves).
mutates_checkout: false

inputs:
  parent:
    required: true
    description: The bead whose direct children make up the wave.
  beads_dir:
    required: true
    description: >-
      Absolute path to the canonical beads directory, handed on to every
      slice. Required for the same reason implement-slice requires it.
  max_slices:
    default: "0"
    description: >-
      Most slices one wave dispatches; the rest go to later waves. 0 means
      no cap.
  tried:
    default: "[]"
    description: >-
      JSON array of beads earlier waves in this chain already dispatched. Set
      by the previous wave; a fresh dispatch leaves it empty.
  previous:
    default: ""
    description: >-
      Run id of the wave that started this one. Set by the previous wave;
      wave-status follows it to read the chain.

nodes:
  # Direct children only, ready and unassigned per bd, minus what this chain
  # already tried, capped at max_slices. A claimed bead is never dispatched:
  # bd's claim is the lock, and `tried` keeps a bead a slice released from
  # coming back in a later wave of the same chain.
  - id: ready
    runtime: bun
    script: ready
    timeout: 120000
    output_format:
      type: object
      properties:
        beads: {type: array}
        count: {type: number}
      required: [beads, count]

  # The seam gate, skipped on an empty wave. An agent proposes seams for every
  # candidate against the code on origin as it stands now, citing the bead
  # text or code each seam comes from, plus the design for any slice that
  # trips implement-with-subagents' design gate, and the engineer approves or answers
  # with comments that revise it: drop a bead from this wave (the next wave
  # offers it again), or take a bead out of the epic. Approved seams land in
  # the beads' notes, where later waves read them as precedent, which is why
  # an uncited seam is never proposed. The body's session carries across
  # rounds, and the group's output is the last proposal, read past the gate.
  - id: seams
    depends_on: [ready]
    when: "$ready.output.count > 0"
    loop_group:
      until_bash: d=$seam-gate.output.decision; test "$d" = approve
      max_iterations: 6
      fresh_context: false
      nodes:
        - id: propose
          # A workflow node loads no plugin it does not name, so the
          # plugin-qualified skill needs its plugin under `plugins:` too.
          plugins: [mattpocock-skills@mattpocock]
          skills: [mattpocock-skills:codebase-design, contract-approval]
          prompt: |
            You propose the seams for one wave of slices. Each slice will be
            built in parallel by an unattended agent in its own worktree cut
            from origin/$BASE_BRANCH. An engineer reads your proposal and
            approves it or answers with comments. Change nothing yourself:
            no file, no bead. Approval writes what you return.

            Load the codebase-design and contract-approval skills, then read
            ~/.claude/skills/implement-with-subagents/DESIGN.md. The build
            follows the same rules, so the seams and designs you propose are
            the ones it starts from.

            Candidate beads this wave: $ready.output.beads
            Read each with: BEADS_DIR=$INPUTS.beads_dir bd show <id>
            Run `git fetch origin`, then read the code at origin/$BASE_BRANCH
            (git show, git grep, git ls-tree), not the working tree, which
            may lag behind it.

            The engineer's comments on your previous proposal, empty the
            first time: $LOOP_PREV.seam-gate.output.text

            For each candidate:
            1. Place its seams per DESIGN.md's Seams, each with its source.
               A planned seam quotes the bead's text (its description,
               design, acceptance criteria or notes). A moved or derived
               seam names the file and symbol at origin that puts it there.
               Where neither the bead nor the code constrains a slice, say
               "nothing in the bead or the code constrains this slice" and
               propose no seam. Every file, module and interface you name
               exists at origin or is one the bead asks for: approved seams
               become precedent for later waves.
            2. Give each seam crossing a service or independent-deploy
               boundary its contract-approval record. Where it has none,
               put the contract in the proposal in full, marked unapproved:
               approving the wave records no contract.
            3. Check it against DESIGN.md's Design gate. Where a trigger
               fires, name the trigger and draft the design that section
               spells out, at its resolution gradient. The engineer approves
               that design at this gate; otherwise the build drafts it alone,
               with nobody watching.

            Then the collisions: every pair of candidates that would edit the
            same code or meet at the same seam, each naming the file and
            symbol. A one-slice wave has none; say so.

            Apply the engineer's comments. A bead they drop stays out of
            `wave` and out of `not_this_epic`; the next wave offers it
            again. A bead they say is not this epic goes in
            `not_this_epic`. Every other candidate goes in `wave`.

            Return:
            - question: the proposal as markdown, written for an engineer
              who has not read the beads. For each candidate: its id and
              what it is in one line, then its seams, each with its source,
              then any unapproved contract, then, where the gate fired, the
              trigger and the design. Then the collisions. End with what
              Approve does, by bead id: whose notes get which seams and
              designs, which beads are dispatched now, which are taken out
              of the epic, and which wait for the next wave. Last, tell them
              how to revise: comment in the text, "drop <id>" to hold a bead
              to the next wave, or "not this epic <id>".
            - wave: the bead ids to dispatch now.
            - seams: one {id, seams} per bead in wave. seams is the text
              appended to that bead's notes: each seam with its source, and
              the design where the gate fired.
            - not_this_epic: the bead ids to take out of the epic.
          output_format:
            type: object
            properties:
              question: {type: string}
              wave: {type: array, items: {type: string}}
              seams:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    seams: {type: string}
                  required: [id, seams]
              not_this_epic: {type: array, items: {type: string}}
            required: [question, wave, seams, not_this_epic]

        - id: seam-gate
          depends_on: [propose]
          wait:
            attention: $propose.output.question
            form: select
            options:
              - id: approve
                label: Approve
                does: Appends the seams to the beads' notes, takes not-this-epic beads out of the epic, and dispatches the wave.
              - id: revise
                label: Revise
                does: Revises the proposal from the text. Say "drop <id>" to hold a bead to the next wave, or "not this epic <id>".

  # Settles the wave: appends the approved seams to each dispatched bead's
  # notes, takes not-this-epic beads out of the parent, and prints the wave
  # with the chain's tried list. A dropped bead is in neither, so a later
  # wave offers it again. Runs on an empty wave too, with no proposal, so
  # slices and next always have their inputs. wave-status reads the wave
  # from here, not from ready.
  - id: apply-seams
    depends_on: [ready, seams]
    trigger_rule: none_failed_min_one_success
    runtime: bun
    script: apply-seams
    timeout: 120000
    with:
      candidates: $ready.output.beads
      proposal: {from: $seams.output, if_skipped: "{}"}
    output_format:
      type: object
      properties:
        beads: {type: array}
        tried: {type: array}
      required: [beads, tried]

  # One implement-slice per approved bead, all at once: a wave's size is
  # capped by max_slices in `ready`, not here. The default all_done join keeps
  # one failed slice from touching its siblings; implement-slice itself
  # decides where its bead lands. A child paused at its review gate holds this node,
  # so the next wave starts only once every slice of this one has finished.
  - id: slices
    depends_on: [apply-seams]
    workflow: implement-slice
    isolation: worktree
    with:
      beads_dir: $INPUTS.beads_dir
    fan_out:
      items: $apply-seams.output.beads
      as: bead
      max_parallel: all

  # Starts the next wave detached when this one dispatched anything, carrying
  # the chain's tried list and this run's id. Default trigger rule: a fan-out
  # that could start no child at all fails, and the chain stops there rather
  # than retrying the same beads forever.
  - id: next
    depends_on: [apply-seams, slices]
    runtime: bun
    script: next
    timeout: 120000
    with:
      wave: $apply-seams.output.beads
      chain: $apply-seams.output.tried
    output_format:
      type: object
      properties:
        next_run: {type: string}
        reason: {type: string}
      required: [next_run, reason]

  # Only on the chain's last wave, the one that found nothing new: closes the
  # parent when every direct child is closed, and otherwise leaves it open and
  # names the children still open, for the end gate and wave-status. A composing
  # workflow cannot do this, since it sees only the first wave of the chain.
  - id: close-parent
    depends_on: [next]
    when: "$next.output.next_run == ''"
    runtime: bun
    script: close-parent
    timeout: 120000
    output_format:
      type: object
      properties:
        closed: {type: boolean}
        open: {type: array}
        reason: {type: string}
      required: [closed, open, reason]

  # The end gate: the chain found nothing new and children are still open. No
  # gate opens when close-parent closed the parent. Re-dispatch starts a new
  # wave of this chain; stop ends the chain here and leaves the parent open.
  - id: end-gate
    depends_on: [close-parent]
    when: "$close-parent.output.closed == false"
    wait:
      attention: |
        The chain found no new ready child, and $close-parent.output.reason.

        Re-dispatch starts a new wave of this chain with the beads you name in
        the text, separated by spaces or commas, cleared from the chain's tried
        list. Leave the text empty to re-dispatch every open, unclaimed child.
        The new wave passes the seam gate again before any slice starts. A
        claimed bead (in_progress) needs `bd unclaim <id>` first, or the
        re-dispatch fails.

        Stop ends the chain and leaves the parent open.
      form: select
      options:
        - id: redispatch
          label: Re-dispatch
          does: Starts a new wave with the named beads, or every open, unclaimed child, cleared from the chain's tried list.
        - id: stop
          label: Stop
          does: Ends the chain and leaves the parent open.

  # Starts the re-dispatched wave detached, naming this run as its previous
  # wave, so wave-status follows the chain into it.
  - id: redispatch
    depends_on: [end-gate]
    when: "$end-gate.output.decision == 'redispatch'"
    runtime: bun
    script: redispatch
    timeout: 120000
    with:
      chain: $apply-seams.output.tried
      text: $end-gate.output.text
    output_format:
      type: object
      properties:
        next_run: {type: string}
        redispatched: {type: array}
      required: [next_run, redispatched]
