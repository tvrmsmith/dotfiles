# One slice run fails outright. The fan-out's all_done join still completes
# the node with a failure marker in that slot, so its sibling's result stands
# and `next` still runs: the chain carries on past one failed slice.
# close-parent is deliberately unstubbed: a wave that starts the next one
# must skip it, and reaching an unstubbed node fails the fixture.
fixture:
  expect: completed
  reached: [ready, propose, seam-gate, apply-seams, slices, next]
  inputs:
    parent: demo
    beads_dir: /tmp/beads

ready:
  beads: [demo.1, demo.2]
  count: 2
propose:
  question: "demo.1 and demo.2 dispatch."
  wave: [demo.1, demo.2]
  seams:
    - {id: demo.1, seams: "nothing in the bead or the code constrains this slice", scenarios: "the bead has no behavioural acceptance criteria"}
    - {id: demo.2, seams: "nothing in the bead or the code constrains this slice", scenarios: "the bead has no behavioural acceptance criteria"}
  not_this_epic: []
seam-gate:
  decision: approve
  text: ""
apply-seams:
  beads: [demo.1, demo.2]
  tried: [demo.1, demo.2]
slices:
  - {archon_failed: true, error: "review failed", status: failed}
  - {merged: true, strategy: squash, pr_number: 3, pr_url: "https://github.com/owner/repo/pull/3", reason: ""}
next:
  next_run: next-wave-run
  reason: this wave dispatched 2, so the next wave looks for more
