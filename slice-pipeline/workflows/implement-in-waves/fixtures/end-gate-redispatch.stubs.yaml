# The end gate chooses re-dispatch for the released child. redispatch is
# handed the chain's tried list and the gate's text, and starts the new wave.
fixture:
  expect: completed
  reached: [ready, apply-seams, slices, next, close-parent, end-gate, redispatch]
  resolved-text-contains:
    end-gate: "parent demo left open: demo.2 (open)"
  inputs:
    parent: demo
    beads_dir: /tmp/beads
    tried: '["demo.1","demo.2"]'

ready:
  beads: []
  count: 0
apply-seams:
  beads: []
  tried: [demo.1, demo.2]
next:
  next_run: ""
  reason: this wave found no new ready child, so the chain ends
close-parent:
  closed: false
  open: [{id: demo.2, status: open, assignee: ""}]
  reason: "parent demo left open: demo.2 (open)"
end-gate:
  decision: redispatch
  text: demo.2
redispatch:
  next_run: redispatched-wave-run
  redispatched: [demo.2]
