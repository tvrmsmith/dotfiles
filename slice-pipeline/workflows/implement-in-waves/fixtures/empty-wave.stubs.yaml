# Nothing new is ready. The fan-out completes at once with no child and needs
# no stub, `next` ends the chain, and close-parent runs to settle the parent.
fixture:
  expect: completed
  reached: [ready, slices, next, close-parent]
  inputs:
    parent: demo
    beads_dir: /tmp/beads

ready:
  beads: []
  tried: [demo.1]
next:
  next_run: ""
  reason: this wave found no new ready child, so the chain ends
close-parent:
  closed: true
  open: []
  reason: "parent demo closed: all 1 children are closed"
