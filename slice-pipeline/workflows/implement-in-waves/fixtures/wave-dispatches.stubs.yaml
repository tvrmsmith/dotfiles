# Three ready children reach the seam gate. The approved proposal dispatches
# two and takes the third out of the epic, so apply-seams settles a wave of
# two: each gets one implement-slice child, and `next` runs once both have
# finished, handed the settled wave and the chain's tried list. The two slice
# results stand in for implement-slice's merge output.
# close-parent is deliberately unstubbed: a wave that starts the next one
# must skip it, and reaching an unstubbed node fails the fixture.
fixture:
  expect: completed
  reached: [ready, propose, seam-gate, apply-seams, slices, next]
  resolved-text-contains:
    propose: "Candidate beads this wave: [\"demo.2\",\"demo.3\",\"demo.4\"]"
  inputs:
    parent: demo
    beads_dir: /tmp/beads
    tried: '["demo.1"]'

ready:
  beads: [demo.2, demo.3, demo.4]
  count: 3
propose:
  question: "demo.2 and demo.3 dispatch with the seams below; demo.4 leaves the epic."
  wave: [demo.2, demo.3]
  seams:
    - {id: demo.2, seams: "touches src/a.ts (bead description)", scenarios: "src/a.feature: Scenario: a greets the user"}
    - {id: demo.3, seams: "nothing in the bead or the code constrains this slice", scenarios: "the bead has no behavioural acceptance criteria"}
  not_this_epic: [demo.4]
seam-gate:
  decision: approve
  text: ""
apply-seams:
  beads: [demo.2, demo.3]
  tried: [demo.1, demo.2, demo.3]
slices:
  - {merged: true, strategy: squash, pr_number: 2, pr_url: "https://github.com/owner/repo/pull/2", reason: ""}
  - {merged: false, strategy: "", pr_number: 0, pr_url: "", reason: "the slice was not delivered, so nothing was merged"}
next:
  next_run: next-wave-run
  reason: this wave dispatched 2, so the next wave looks for more
