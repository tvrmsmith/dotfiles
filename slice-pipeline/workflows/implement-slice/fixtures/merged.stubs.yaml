# Landed, shipped and merged: verify sees a commit and a green suite,
# validate drives it through no-mistakes to a checks-passed PR, merge reports
# the forge confirmed the merge, and close closes the bead. The authored
# outcome (`merged`) is a success.
#
# `release` is deliberately left unstubbed: the fixture language has no
# negative `reached` assertion, so an unstubbed node that gets reached fails
# the fixture with a missing-stub error. The omission IS the guard assertion.
# If `$merge.output.merged == false` ever let `release` through on a merged
# slice, this fixture goes red.
fixture:
  expect: completed
  reached: [claim, build, verify, validate, merge, close]
  inputs:
    bead: demo-slice-1
    beads_dir: /tmp/beads

claim:
  bead: demo-slice-1
  beads_dir: /tmp/beads
  branch: slice/demo-slice-1
build: "the slice is built and committed"
verify:
  verified: true
  committed: true
  tests_touched: true
  branch: slice/demo-slice-1
  sha: 1f0c6a4e2b7d9c3a5e8f10b2d4c6a8e0f2b4d6c8
  reason: ""
  waivers: []
  waivers_error: ""
validate:
  delivered: true
  outcome: checks-passed
  pr_number: 42
  pr_url: https://github.com/owner/repo/pull/42
  repo: owner/repo
  fix_rounds: 1
  record_posted: true
  reason: ""
merge:
  merged: true
  strategy: squash
  pr_number: 42
  pr_url: https://github.com/owner/repo/pull/42
  reason: ""
close:
  closed: true
  worktree_removed: true
  reason: ""
