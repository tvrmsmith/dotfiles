# Claim failed: `claim` is left unstubbed, so it fails with a missing stub.
# `release` is left unstubbed too, so reaching it would add a second failed
# node and break the exact `fail-node` set. That is the guard: a run that
# never claimed the bead must not release it. Archon tolerates an unstubbed
# all_done join, so this guard holds only while release keeps the default
# trigger rule. `close` is left unstubbed for the same reason: a run that
# never claimed the bead must not close it either.
#
# verify still runs under all_done, and its verdict is pinned false: a run
# that never claimed the bead is never on its branch, so verify-commit
# credits nothing. validate depends on verify alone, not claim, so it still
# runs too and short-circuits on that false verdict, and review and merge,
# depending on validate and not claim, short-circuit behind it. release's dependency on claim,
# not merge's own success, is what stops it running here.
fixture:
  expect: failed
  fail-node: claim
  reached: [verify, validate, review-round, review, merge]
  inputs:
    bead: demo-slice-1
    beads_dir: /tmp/beads

verify:
  verified: false
  committed: false
  tests_touched: false
  branch: slice/demo-slice-1
  sha: ""
  reason: "this worktree is not on slice/demo-slice-1, so this run never claimed it"
  waivers: []
  waivers_error: ""
validate:
  delivered: false
  outcome: ""
  pr_number: 0
  pr_url: ""
  repo: ""
  fix_rounds: 0
  record_posted: false
  reason: "verification did not pass, so validation was skipped"
review-round:
  outcome: undelivered
  approved: false
  cursor: ""
  head_sha: ""
  comments: 0
  reason: "the slice was not delivered, so review was skipped"
merge:
  merged: false
  strategy: ""
  pr_number: 0
  pr_url: ""
  reason: "the slice was not approved in review, so nothing was merged"
