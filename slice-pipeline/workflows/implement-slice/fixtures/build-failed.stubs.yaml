# Build failed: `build` is left unstubbed, so it fails with a missing stub.
# verify joins on all_done, so it still runs, and its false verdict lets
# validate and merge short-circuit and release hand the bead back. If verify
# ever lost all_done, it would be skipped, validate, merge and release with
# it, and `reached` would go red. `close` is left unstubbed, so reaching it
# would add a second failed node and break the exact `fail-node` set: an
# unbuilt slice must never close its bead.
fixture:
  expect: failed
  fail-node: build
  reached: [claim, verify, validate, merge, release]
  inputs:
    bead: demo-slice-1
    beads_dir: /tmp/beads

claim:
  bead: demo-slice-1
  beads_dir: /tmp/beads
  branch: slice/demo-slice-1
verify:
  verified: false
  committed: false
  tests_touched: false
  branch: slice/demo-slice-1
  sha: ""
  reason: "no commit on slice/demo-slice-1 beyond origin/HEAD"
  waivers: []
  waivers_error: ""
validate:
  delivered: false
  outcome: ""
  pr_number: 0
  pr_url: ""
  repo: ""
  fix_rounds: 0
  record_posted: false
  reason: "verification did not pass, so validation was skipped"
merge:
  merged: false
  strategy: ""
  pr_number: 0
  pr_url: ""
  reason: "the slice was not delivered, so nothing was merged"
release:
  released: true
