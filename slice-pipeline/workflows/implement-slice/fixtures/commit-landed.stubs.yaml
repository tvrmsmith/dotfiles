# Landed path: verify sees a commit and a green suite, so the authored
# outcome is a success. `release` is deliberately left unstubbed: the fixture
# language has no negative `reached` assertion, so an unstubbed node that gets
# reached fails the fixture with a missing-stub error. The omission IS the
# guard assertion. If `$verify.output.verified == false` ever let `release`
# through on a landed slice, this fixture goes red.
fixture:
  expect: completed
  reached: [claim, build, verify]
  inputs:
    bead: demo-slice-1
    beads_dir: /tmp/beads

claim:
  bead: demo-slice-1
  beads_dir: /tmp/beads
  branch: slice/demo-slice-1
build: "the slice is built and committed"
verify:
  verified: true
  committed: true
  tests_touched: true
  branch: slice/demo-slice-1
  sha: 1f0c6a4e2b7d9c3a5e8f10b2d4c6a8e0f2b4d6c8
  reason: ""
  waivers: []
  waivers_error: ""
