# Nothing landed: build never got a commit onto the branch, so verify reports
# verified: false, validate short-circuits to delivered: false, review
# short-circuits to outcome undelivered without opening a tab, merge
# short-circuits to merged: false, and release runs to hand the bead back.
#
# `expect: completed` with a failed authored outcome is the point, not a
# mistake: verify, validate, review and merge (given a true or false flag)
# all exit 0 on every verdict so their artifacts survive, and the run completing
# while the outcome is failed is exactly what a caller must tell apart by
# reading the authored outcome (`merged`) instead of the run status.
#
# `reached: [..., release]` is the other half of the guard assertion this
# workflow has no dedicated key for: an unparseable `when:` is fail-closed and
# silently skips the node, so a typo in the guard would still pass
# merged.stubs.yaml and only show up here. `close` is left unstubbed, so
# reaching it fails this fixture with a missing-stub error: nothing was
# merged, so the bead must stay open.
#
# `expect: completed` does not prove this path has no approval gate:
# `archon workflow test` auto-approves gates, so a gate here would still
# report completed. Nothing in this directory checks for one (dotfiles-co3.21
# tracks that check).
fixture:
  expect: completed
  reached: [claim, build, verify, validate, review-round, review, merge, release]
  inputs:
    bead: demo-slice-1
    beads_dir: /tmp/beads

claim:
  bead: demo-slice-1
  beads_dir: /tmp/beads
  branch: slice/demo-slice-1
build: "the worker could not implement the slice"
verify:
  verified: false
  committed: false
  tests_touched: false
  branch: slice/demo-slice-1
  sha: ""
  reason: "no commit on slice/demo-slice-1 beyond origin/main"
  waivers: []
  waivers_error: ""
validate:
  delivered: false
  outcome: ""
  pr_number: 0
  pr_url: ""
  repo: ""
  fix_rounds: 0
  record_posted: false
  reason: "verification did not pass, so validation was skipped"
review-round:
  outcome: undelivered
  approved: false
  cursor: ""
  head_sha: ""
  comments: 0
  reason: "the slice was not delivered, so review was skipped"
merge:
  merged: false
  strategy: ""
  pr_number: 0
  pr_url: ""
  reason: "the slice was not approved in review, so nothing was merged"
release:
  released: true
