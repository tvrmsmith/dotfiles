name: implement-slice
description: |
  Build one vertical slice from its bead, land its commit on the branch, and
  drive it through no-mistakes to a green pull request with a findings record.
  The slice's spec lives in the bead's `design` field, the wave's agreed seams
  in its `notes` field. Verify reads the branch, not a model's self-report.

  Use when: a bead is ready and its spec lives in the bead. Run one per slice,
  normally as a fan_out child.
  NOT for: deciding what to build, or work that cannot land independently.

model: large
returns: validate
outcome_field: delivered

# Pinned, not left to the caller. The driver fans out several of these at
# once, and runs sharing one checkout serialize on the working-path lock,
# where the younger ones fail outright. Pinning also turns a `--no-worktree`
# dispatch into a load error rather than a stampede.
worktree:
  enabled: true

inputs:
  bead:
    required: true
    description: The bead id for this slice. Its spec is in the bead, not here.
  beads_dir:
    required: true
    description: >-
      Absolute path to the canonical beads directory. Required because Archon
      works from its own clone, where the embedded database directory is
      gitignored and therefore absent.

nodes:
  # Timeout covers real network calls, not a bare `bd update`: claim now
  # checks the target repo through gh and no-mistakes and can drive up to 3
  # branch-sync rounds through no-mistakes before it claims the bead.
  - id: claim
    timeout: 600000
    bash: slice-wave claim --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR"
    output_format:
      type: object
      properties:
        bead: {type: string}
        beads_dir: {type: string}
        branch: {type: string}
      required: [bead, beads_dir, branch]

  # Prompt node, not exec: this is the one node judgment lives in. Denies
  # AskUserQuestion because Archon has no in-node human channel. The tool is
  # permitted by default, and a node that calls it has no way for an answer to
  # come back, so it hangs until a timeout. That denial is what makes the
  # skill's unattended mode survivable. idle_timeout is raised to 90 minutes
  # because this node's whole job is to sit behind subagents that each run for
  # many minutes without the parent emitting a token; the 30-minute default
  # would kill it mid-slice.
  - id: build
    depends_on: [claim]
    idle_timeout: 5400000
    skills: [implement-with-subagents]
    denied_tools: [AskUserQuestion]
    prompt: |
      Build the slice on bead $INPUTS.bead. Run unattended.

      This checkout has no beads database of its own. Read the bead with
      `BEADS_DIR=$INPUTS.beads_dir bd show $INPUTS.bead`, and set
      `BEADS_DIR=$INPUTS.beads_dir` the same way on every other bd command,
      including any bead you file.

      Leave bead $INPUTS.bead open and claimed when you finish, even once the
      slice is committed. Closing it releases every slice that depends on it,
      so this pipeline closes it itself, only after the work has merged. That
      overrides the usual rule to close finished work.

  # Joins on all_done, not the default: under the default, a failed `build`
  # would skip `verify`, which would skip `validate` and `release` behind it,
  # and the bead would stay claimed by a worker that is gone. all_done runs
  # the commit check on every path out of build. verify reads none of build's
  # output, so it never references a failed producer. all_done also runs
  # verify after a failed claim; verify-commit credits the slice branch only
  # while this worktree has it checked out, which a failed claim never leaves
  # behind.
  #
  # Exits 0 on every verdict, landed or not, so the run completes and its
  # artifacts survive either way. Its `verified` field only feeds validate's
  # --verified flag below; the run's authored outcome is `delivered`, read
  # from validate (outcome_field above), since a landed commit is not by
  # itself a shipped slice.
  - id: verify
    depends_on: [claim, build]
    trigger_rule: all_done
    timeout: 120000
    bash: slice-wave verify-commit --bead "$INPUTS_BEAD"
    output_format:
      type: object
      properties:
        verified: {type: boolean}
        committed: {type: boolean}
        tests_touched: {type: boolean}
        branch: {type: string}
        sha: {type: string}
        reason: {type: string}
        waivers: {type: array}
        waivers_error: {type: string}
      required: [verified, committed, tests_touched, branch, sha, reason, waivers, waivers_error]

  # The returns node: no `when:`, since a skipped returns node persists no
  # authored outcome, and the script's own --verified false short-circuit
  # already handles the unverified path with no external call. depends_on
  # verify alone, under the default trigger rule (not all_done): verify
  # itself exits 0 on every verdict (see its comment above), so it never
  # fails this dependency. The long timeout covers a real no-mistakes drive:
  # a review, fix rounds and CI, which routinely outruns Archon's 2-minute
  # default. slice-wave stops reattaching to the drive at 3.5 hours, so it
  # still reports delivered false before this timeout kills it.
  - id: validate
    depends_on: [verify]
    timeout: 14400000
    bash: slice-wave validate --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR" --verified $verify.output.verified
    output_format:
      type: object
      properties:
        delivered: {type: boolean}
        outcome: {type: string}
        pr_number: {type: integer}
        pr_url: {type: string}
        repo: {type: string}
        fix_rounds: {type: integer}
        record_posted: {type: boolean}
        reason: {type: string}
      required: [delivered, outcome, pr_number, pr_url, repo, fix_rounds, record_posted, reason]

  # Depends on claim as well as validate, under the default trigger rule (not
  # all_done): validate always resolves (it is the returns node and, given a
  # true or false --verified, exits 0 on every path, same as verify), so
  # requiring it to succeed costs nothing; its `delivered` field, not its own
  # success, is what the `when` reads.
  # Requiring claim to have succeeded is what stops this node from releasing a
  # bead this run never claimed, which would clear the assignee of whoever
  # actually holds it. An unverified run still lands here: validate's
  # --verified false short-circuit reports delivered false without
  # contacting anything, and that false is what this `when` catches.
  - id: release
    depends_on: [claim, validate]
    when: "$validate.output.delivered == false"
    timeout: 120000
    bash: slice-wave release --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR"
    output_format:
      type: object
      properties:
        released: {type: boolean}
      required: [released]
