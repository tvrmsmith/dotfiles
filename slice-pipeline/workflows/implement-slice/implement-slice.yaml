name: implement-slice
description: |
  Build one vertical slice from its bead, land its commit on the branch, drive
  it through no-mistakes to a green pull request with a findings record, merge
  it, and close the bead once the forge confirms the merge. The slice's spec
  lives in the bead's `design` field, the wave's agreed seams in its `notes`
  field. Verify reads the branch, not a model's self-report, and merge reads
  the forge, not the merge command's exit status.

  Use when: a bead is ready and its spec lives in the bead. Run one per slice,
  normally as a fan_out child.
  NOT for: deciding what to build, or work that cannot land independently.

model: large
returns: merge
outcome_field: merged

# Pinned, not left to the caller. The driver fans out several of these at
# once, and runs sharing one checkout serialize on the working-path lock,
# where the younger ones fail outright. Pinning also turns a `--no-worktree`
# dispatch into a load error rather than a stampede.
worktree:
  enabled: true

inputs:
  bead:
    required: true
    description: The bead id for this slice. Its spec is in the bead, not here.
  beads_dir:
    required: true
    description: >-
      Absolute path to the canonical beads directory. Required because Archon
      works from its own clone, where the embedded database directory is
      gitignored and therefore absent.

nodes:
  # Timeout covers real network calls, not a bare `bd update`: claim now
  # checks the target repo through gh and no-mistakes and can drive up to 3
  # branch-sync rounds through no-mistakes before it claims the bead.
  - id: claim
    timeout: 600000
    bash: slice-wave claim --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR"
    output_format:
      type: object
      properties:
        bead: {type: string}
        beads_dir: {type: string}
        branch: {type: string}
      required: [bead, beads_dir, branch]

  # Prompt node, not exec: this is the one node judgment lives in. Denies
  # AskUserQuestion because Archon has no in-node human channel. The tool is
  # permitted by default, and a node that calls it has no way for an answer to
  # come back, so it hangs until a timeout. That denial is what makes the
  # skill's unattended mode survivable. idle_timeout is raised to 90 minutes
  # because this node's whole job is to sit behind subagents that each run for
  # many minutes without the parent emitting a token; the 30-minute default
  # would kill it mid-slice.
  - id: build
    depends_on: [claim]
    idle_timeout: 5400000
    skills: [implement-with-subagents]
    denied_tools: [AskUserQuestion]
    prompt: |
      Build the slice on bead $INPUTS.bead. Run unattended.

      This checkout has no beads database of its own. Read the bead with
      `BEADS_DIR=$INPUTS.beads_dir bd show $INPUTS.bead`, and set
      `BEADS_DIR=$INPUTS.beads_dir` the same way on every other bd command,
      including any bead you file.

      Leave bead $INPUTS.bead open and claimed when you finish, even once the
      slice is committed. Closing it releases every slice that depends on it,
      so this pipeline closes it itself, only after the work has merged. That
      overrides the usual rule to close finished work.

  # Joins on all_done, not the default: under the default, a failed `build`
  # would skip `verify`, which would skip `validate`, `merge` and `release`
  # behind it, and the bead would stay claimed by a worker that is gone.
  # all_done runs the commit check on every path out of build. verify reads
  # none of build's output, so it never references a failed producer.
  # all_done also runs verify after a failed claim; verify-commit credits the
  # slice branch only while this worktree has it checked out, which a failed
  # claim never leaves behind.
  #
  # Exits 0 on every verdict, landed or not, so the run completes and its
  # artifacts survive either way. Its `verified` field only feeds validate's
  # --verified flag below; the run's authored outcome is `merged`, read from
  # merge (outcome_field above), since a landed commit is not by itself a
  # merged slice.
  - id: verify
    depends_on: [claim, build]
    trigger_rule: all_done
    timeout: 120000
    bash: slice-wave verify-commit --bead "$INPUTS_BEAD"
    output_format:
      type: object
      properties:
        verified: {type: boolean}
        committed: {type: boolean}
        tests_touched: {type: boolean}
        branch: {type: string}
        sha: {type: string}
        reason: {type: string}
        waivers: {type: array}
        waivers_error: {type: string}
      required: [verified, committed, tests_touched, branch, sha, reason, waivers, waivers_error]

  # No `when:`: a skipped validate would skip merge behind it, and merge is
  # the returns node, which persists no authored outcome when skipped. The
  # script's own --verified false short-circuit already handles the
  # unverified path with no external call. depends_on verify alone, under the default trigger rule (not all_done): verify
  # itself exits 0 on every verdict (see its comment above), so it never
  # fails this dependency. The long timeout covers a real no-mistakes drive:
  # a review, fix rounds and CI, which routinely outruns Archon's 2-minute
  # default. slice-wave stops reattaching to the drive at 3.5 hours, so it
  # still reports delivered false before this timeout kills it.
  - id: validate
    depends_on: [verify]
    timeout: 14400000
    bash: slice-wave validate --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR" --verified $verify.output.verified
    output_format:
      type: object
      properties:
        delivered: {type: boolean}
        outcome: {type: string}
        pr_number: {type: integer}
        pr_url: {type: string}
        repo: {type: string}
        fix_rounds: {type: integer}
        record_posted: {type: boolean}
        reason: {type: string}
      required: [delivered, outcome, pr_number, pr_url, repo, fix_rounds, record_posted, reason]

  # The returns node: no `when:`, since a skipped returns node persists no
  # authored outcome, and the script's own --delivered false short-circuit
  # already handles the undelivered path with no external call, accepting
  # the empty repo and zero pull request validate reports there. depends_on
  # validate alone, under the default trigger rule: validate exits 0 on every
  # path (see its comment above), so it never fails this dependency. The
  # timeout covers the script's own 2-hour merge-queue deadline, so a merge
  # still waiting on the queue reports merged false before this kills it.
  # Archon shell-quotes a substituted node output in a bash body, so an empty
  # repo arrives as ''.
  - id: merge
    depends_on: [validate]
    timeout: 9000000
    bash: slice-wave merge --delivered $validate.output.delivered --pr $validate.output.pr_number --repo $validate.output.repo
    output_format:
      type: object
      properties:
        merged: {type: boolean}
        strategy: {type: string}
        pr_number: {type: integer}
        pr_url: {type: string}
        reason: {type: string}
      required: [merged, strategy, pr_number, pr_url, reason]

  # Closing the bead unblocks every slice that depends on it, so only a merge
  # the forge confirmed reaches this node: merge reports merged true only
  # after a forge read returns MERGED, never on the merge command's exit status
  # alone. Default trigger rule, since the `when` already requires merge to
  # have produced output. The timeout covers one `bd close` and one
  # `git worktree remove`, which Archon's 2-minute default already fits.
  - id: close
    depends_on: [merge]
    when: "$merge.output.merged == true"
    timeout: 120000
    bash: slice-wave close --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR" --pr-url $merge.output.pr_url
    output_format:
      type: object
      properties:
        closed: {type: boolean}
        worktree_removed: {type: boolean}
        reason: {type: string}
      required: [closed, worktree_removed, reason]

  # An unmerged slice goes back to the frontier open and unclaimed, whether it
  # was never delivered or its green pull request did not merge; that pull
  # request is left open for a person to look at. Depends on claim as well as
  # merge, under the default trigger rule (not all_done): merge always
  # resolves (it is the returns node and, given a true or false --delivered,
  # exits 0 on every path, same as validate), so requiring it to succeed
  # costs nothing; its `merged` field, not its own success, is what the
  # `when` reads.
  # Requiring claim to have succeeded is what stops this node from releasing a
  # bead this run never claimed, which would clear the assignee of whoever
  # actually holds it. An unverified run still lands here: validate and merge
  # both short-circuit without contacting anything, and merge's false is what
  # this `when` catches. The timeout covers one `bd update`.
  - id: release
    depends_on: [claim, merge]
    when: "$merge.output.merged == false"
    timeout: 120000
    bash: slice-wave release --bead "$INPUTS_BEAD" --beads-dir "$INPUTS_BEADS_DIR"
    output_format:
      type: object
      properties:
        released: {type: boolean}
      required: [released]
