name: implement-slice
description: |
  Build one vertical slice from its bead and land it on main. Done means the
  slice's commit is an ancestor of origin/main, not that a branch exists.

  Use when: a bead is ready and its spec lives in the bead. Run one per slice,
  normally as a fan_out child with isolation: worktree.
  NOT for: deciding what to build, or work that cannot land independently.

model: large
returns: verify
outcome_field: landed

# Pinned, not left to the caller. The driver fans out N of these at once, and
# runs sharing one checkout serialize on the working-path lock: the younger
# ones fail with "This worktree is in use". `enabled: true` also makes
# `--no-worktree` a hard error rather than a silent stampede.
worktree:
  enabled: true

inputs:
  bead:
    description: The bead id for this slice. Its spec is in the bead, not here.
  beads_dir:
    default: ""
    description: >-
      Absolute path to the canonical .beads directory. Required because Archon
      works from its own clone, where embeddeddolt/ is gitignored and absent.
  test_cmd:
    default: "bun test"
    description: The project's test command. Must exit non-zero on failure.

nodes:
  # script, not bash: `$INPUTS.*` is NOT substituted into a bash body. Only
  # `with:` bindings reach it, as INPUTS_<UPPER_SNAKE> env vars, and `with:`
  # is supported on script/command nodes only.
  - id: claim
    runtime: bun
    with:
      bead: "$INPUTS.bead"
      beads_dir: "$INPUTS.beads_dir"
    script: |
      const { $ } = await import("bun");
      const env = { ...process.env, BEADS_DIR: process.env.INPUTS_BEADS_DIR };
      await $`bd update ${process.env.INPUTS_BEAD} --claim`.env(env).quiet();
      console.log(JSON.stringify({ claimed: true }));

  # TDD until the suite is green. until_bash, not a prose sentinel: the test
  # command is the authority on green, never the model's account of it.
  - id: build
    depends_on: [claim]
    loop_group:
      until_bash: test "$test.output" = "green"
      max_iterations: 8
      fresh_context: false
      nodes:
        - id: code
          skills: [tdd, coding-standards, engineering-principles]
          prompt: |
            Slice: bead $INPUTS.bead. Read it for the spec and acceptance
            criteria; everything you need is on the bead, not in this prompt.

            Previous iteration's test output: $LOOP_PREV.test.output

            Work test-first. One failing test, then the minimum code to green
            it. Commit as you go on this worktree's branch.

        - id: test
          depends_on: [code]
          runtime: bun
          with:
            test_cmd: "$INPUTS.test_cmd"
          script: |
            const { $ } = await import("bun");
            const log = `${process.env.ARTIFACTS_DIR}/test.log`;
            const r = await $`sh -c ${process.env.INPUTS_TEST_CMD + " > " + log + " 2>&1"}`.nothrow();
            if (r.exitCode !== 0) console.error(await Bun.file(log).text());
            process.stdout.write(r.exitCode === 0 ? "green" : "red");

  # Land it. A worker is not done until its code is on main.
  - id: land
    depends_on: [build]
    skills: [no-mistakes]
    prompt: |
      The slice is green on this worktree's branch. Land it on main:
      push the branch, open a PR, wait for required checks, and squash-merge
      once they pass. Do not admin-bypass a failing check. If the branch has
      fallen behind main, sync it and let CI re-run.

      Report the merge commit sha on main.

  # The only statement of done that is not a model's self-report.
  - id: verify
    depends_on: [land]
    runtime: bun
    with:
      bead: "$INPUTS.bead"
      beads_dir: "$INPUTS.beads_dir"
    script: |
      const { $ } = await import("bun");
      const bead = process.env.INPUTS_BEAD;
      const env = { ...process.env, BEADS_DIR: process.env.INPUTS_BEADS_DIR };
      await $`git fetch origin main --quiet`;
      const sha = (await $`git rev-parse HEAD`.text()).trim();
      const landed =
        (await $`git merge-base --is-ancestor ${sha} origin/main`.nothrow()).exitCode === 0;
      if (landed) {
        // The bead outlives the worktree, and removing a worktree deletes its
        // branch, so the sha in the close reason is the durable handle.
        await $`bd close ${bead} --reason ${"landed on main as " + sha}`.env(env).quiet();
      } else {
        // Release the claim, or this bead vanishes from `bd ready --unassigned`
        // while still being open work, and the driver's wave loop stalls silently.
        await $`bd update ${bead} -a ${""} -s open`.env(env).quiet();
      }
      console.log(JSON.stringify({ landed, sha }));
    output_format:
      type: object
      properties:
        landed: {type: boolean}
        sha: {type: string}
      required: [landed, sha]
