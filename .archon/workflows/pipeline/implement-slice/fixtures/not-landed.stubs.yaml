# The slice went green but never reached main (PR open, checks red, merge
# refused). The RUN still completes — verify exits 0 either way — and only the
# authored outcome is false. That split is the point: the driver must gate on
# the authored outcome, not on the run finishing.
fixture:
  expect: completed
  reached: [claim, code, test, land, verify]
  inputs:
    bead: dotfiles-7sp
    beads_dir: /tmp/beads

claim: '{"claimed":true}'
code: "wrote a failing test, then greened it"
test: green
land: "opened the PR; a required check is red, so nothing merged"
verify:
  landed: false
  sha: deadbeef
